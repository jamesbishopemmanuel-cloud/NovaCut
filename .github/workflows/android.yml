name: Build NovaCut Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/editor-upgrade]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name novacut .
      - name: Remove generated placeholder test for nonexistent MyApp
        run: rm -f test/widget_test.dart
      - name: Set Android compile SDK 36 and minimum SDK for FFmpeg
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          files = [p for p in candidates if p.exists()]
          if not files:
              raise SystemExit("Android app Gradle file was not generated")
          for path in files:
              source = path.read_text()
              updated = source
              # Plugins in this project require Android API 36 to compile.
              if re.search(r"compileSdk\s*=\s*flutter\.compileSdkVersion", updated):
                  updated = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", updated)
              elif re.search(r"compileSdk\s*=\s*\d+", updated):
                  updated = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", updated, count=1)
              elif re.search(r"compileSdkVersion\s+flutter\.compileSdkVersion", updated):
                  updated = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", updated)
              elif re.search(r"compileSdkVersion\s+\d+", updated):
                  updated = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", updated, count=1)
              else:
                  raise SystemExit(f"Could not locate compileSdk setting in {path}")
              updated = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", updated)
              updated = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", updated)
              if updated != source:
                  path.write_text(updated)
          print("Set Android compile SDK to 36 and minimum SDK to 24.")
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Build optimized per-ABI release APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Build Android App Bundle for Play Store
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
      - name: Report APK sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path("build/app/outputs/flutter-apk").glob("*.apk"))
          if not files:
              raise SystemExit("No APKs were generated")
          for file in files:
              print(f"{file.name}: {file.stat().st_size / (1024 * 1024):.2f} MiB")
          PY
      - name: Upload optimized APKs and Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: novacut-optimized-android-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/**
