name: Build NovaCut Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name novacut .
      - name: Set Android minimum SDK for FFmpeg
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          files = [p for p in candidates if p.exists()]
          if not files:
              raise SystemExit("Android app Gradle file was not generated")
          for path in files:
              source = path.read_text()
              updated = re.sub(r"minSdk\\s*=\\s*flutter\\.minSdkVersion", "minSdk = 24", source)
              updated = re.sub(r"minSdkVersion\\s+flutter\\.minSdkVersion", "minSdkVersion 24", updated)
              if updated != source:
                  path.write_text(updated)
          print("Checked Android minimum SDK (FFmpeg requires API 24+).")
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacut-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
