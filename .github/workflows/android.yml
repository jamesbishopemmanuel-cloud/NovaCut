name: Build NovaCut Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package has been removed from Google's repository.
          packages: platform-tools
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name novacut .
      - name: Set Android compile SDK 36 and minimum SDK for FFmpeg
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          files = [p for p in candidates if p.exists()]
          if not files:
              raise SystemExit("Android app Gradle file was not generated")

          for path in files:
              source = path.read_text()
              updated = source
              if re.search(r"compileSdk\s*=\s*flutter\.compileSdkVersion", updated):
                  updated = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", updated)
              elif re.search(r"compileSdk\s*=\s*\d+", updated):
                  updated = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", updated, count=1)
              elif re.search(r"compileSdkVersion\s+flutter\.compileSdkVersion", updated):
                  updated = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", updated)
              elif re.search(r"compileSdkVersion\s+\d+", updated):
                  updated = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", updated, count=1)
              else:
                  raise SystemExit(f"Could not locate compileSdk setting in {path}")
              updated = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", updated)
              updated = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", updated)
              path.write_text(updated)

          # Some Flutter plugins set their own compileSdk (the failing
          # flutter_plugin_android_lifecycle dependency was still on API 34).
          # Apply API 36 to every Android subproject, not just the app module.
          groovy_root = Path("android/build.gradle")
          kotlin_root = Path("android/build.gradle.kts")
          root_gradle = groovy_root if groovy_root.exists() else kotlin_root
          if not root_gradle.exists():
              raise SystemExit("Neither android/build.gradle nor android/build.gradle.kts was generated")

          root_source = root_gradle.read_text()
          marker = "Keep every Android plugin module compatible with API 36 dependencies."
          if marker not in root_source:
              if root_gradle.suffix == ".kts":
                  override = """
                  
                  // Keep every Android plugin module compatible with API 36 dependencies.
                  subprojects {
                      afterEvaluate {
                          val androidExtension = extensions.findByName("android")
                          if (androidExtension != null) {
                              val compileSdkSetter = androidExtension.javaClass.methods.firstOrNull {
                                  (it.name == "setCompileSdk" || it.name == "setCompileSdkVersion") &&
                                      it.parameterCount == 1 &&
                                      (it.parameterTypes[0] == Integer.TYPE ||
                                          it.parameterTypes[0] == Integer::class.java)
                              }
                              if (compileSdkSetter != null) {
                                  compileSdkSetter.invoke(androidExtension, 36)
                              } else {
                                  val compileSdkMethod = androidExtension.javaClass.methods.firstOrNull {
                                      it.name == "compileSdkVersion" && it.parameterCount == 1
                                  }
                                  if (compileSdkMethod == null) {
                                      throw GradleException("Cannot set compile SDK 36 for ${project.path}")
                                  }
                                  compileSdkMethod.invoke(androidExtension, 36)
                              }
                          }
                      }
                  }
                  """
              else:
                  override = """
                  
                  // Keep every Android plugin module compatible with API 36 dependencies.
                  subprojects {
                      afterEvaluate { subproject ->
                          def androidExtension = subproject.extensions.findByName("android")
                          if (androidExtension != null) {
                              androidExtension.compileSdkVersion 36
                          }
                      }
                  }
                  """
              root_gradle.write_text(root_source.rstrip() + "\n" + override)
          print("Set app and Android plugin modules to compile SDK 36; minimum SDK 24.")
          PY
      - name: Install Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacut-release-apk
          path: build/app/outputs/flutter-apk/*.apk
