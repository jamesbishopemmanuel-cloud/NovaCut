name: Build NovaCut Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name novacut .
      - name: Set Android compile SDK 36 and minimum SDK for FFmpeg
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          files = [p for p in candidates if p.exists()]
          if not files:
              raise SystemExit("Android app Gradle file was not generated")

          for path in files:
              source = path.read_text()
              updated = source
              if re.search(r"compileSdk\\s*=\\s*flutter\\.compileSdkVersion", updated):
                  updated = re.sub(r"compileSdk\\s*=\\s*flutter\\.compileSdkVersion", "compileSdk = 36", updated)
              elif re.search(r"compileSdk\\s*=\\s*\\d+", updated):
                  updated = re.sub(r"compileSdk\\s*=\\s*\\d+", "compileSdk = 36", updated, count=1)
              elif re.search(r"compileSdkVersion\\s+flutter\\.compileSdkVersion", updated):
                  updated = re.sub(r"compileSdkVersion\\s+flutter\\.compileSdkVersion", "compileSdkVersion 36", updated)
              elif re.search(r"compileSdkVersion\\s+\\d+", updated):
                  updated = re.sub(r"compileSdkVersion\\s+\\d+", "compileSdkVersion 36", updated, count=1)
              else:
                  raise SystemExit(f"Could not locate compileSdk setting in {path}")
              updated = re.sub(r"minSdk\\s*=\\s*flutter\\.minSdkVersion", "minSdk = 24", updated)
              updated = re.sub(r"minSdkVersion\\s+flutter\\.minSdkVersion", "minSdkVersion 24", updated)
              path.write_text(updated)

          groovy_root = Path("android/build.gradle")
          kotlin_root = Path("android/build.gradle.kts")
          root_gradle = groovy_root if groovy_root.exists() else kotlin_root
          if not root_gradle.exists():
              raise SystemExit("Neither android/build.gradle nor android/build.gradle.kts was generated")

          root_source = root_gradle.read_text()
          marker = "Configure Android library modules for compile SDK 36 without afterEvaluate."
          if marker not in root_source:
              if root_gradle.suffix == ".kts":
                  override = """
                  
                  // Configure Android library modules for compile SDK 36 without afterEvaluate.
                  subprojects {
                      plugins.withId("com.android.library") {
                          extensions.configure<com.android.build.gradle.LibraryExtension>("android") {
                              compileSdk = 36
                          }
                      }
                  }
                  """
              else:
                  override = """
                  
                  // Configure Android library modules for compile SDK 36 without afterEvaluate.
                  subprojects {
                      plugins.withId("com.android.library") {
                          extensions.configure(com.android.build.gradle.LibraryExtension) {
                              compileSdkVersion 36
                          }
                      }
                  }
                  """
              root_gradle.write_text(root_source.rstrip() + "\\n" + override)
          print("Set app and Android library modules to compile SDK 36; minimum SDK 24.")
          PY
      - name: Install Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Force all cached Android plugins to compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path.home() / ".pub-cache" / "hosted" / "pub.dev"]
          changed = []
          checked = 0
          patterns = [
              (re.compile(r"(?m)^(\\s*compileSdk\\s*=\\s*)(?:flutter\\.compileSdkVersion|\\d+)"), r"\\g<1>36"),
              (re.compile(r"(?m)^(\\s*compileSdkVersion\\s+)(?:flutter\\.compileSdkVersion|\\d+)"), r"\\g<1>36"),
              (re.compile(r"(?m)^(\\s*compileSdk\\s+)(?:flutter\\.compileSdkVersion|\\d+)"), r"\\g<1>36"),
          ]

          for root in roots:
              if not root.exists():
                  continue
              for path in root.glob("*/**/android/build.gradle*"):
                  try:
                      source = path.read_text()
                  except (OSError, UnicodeError):
                      continue
                  checked += 1
                  updated = source
                  for pattern, replacement in patterns:
                      updated = pattern.sub(replacement, updated)
                  if updated != source:
                      path.write_text(updated)
                      changed.append(str(path))

          print(f"Checked {checked} cached Android plugin Gradle files.")
          print(f"Raised compile SDK to 36 in {len(changed)} plugin files.")
          for path in changed:
              print(f"Patched: {path}")

          for plugin in ("file_picker", "flutter_plugin_android_lifecycle"):
              matches = list((Path.home() / ".pub-cache" / "hosted" / "pub.dev").glob(f"{plugin}-*/android/build.gradle*"))
              if not matches:
                  print(f"Notice: no cached Gradle file found for {plugin}.")
                  continue
              for path in matches:
                  source = path.read_text()
                  if re.search(r"(?m)^\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?(?:34|flutter\\.compileSdkVersion)", source):
                      raise SystemExit(f"{plugin} still has an unpatched compile SDK setting in {path}")
          PY
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Report APK sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for apk in sorted(Path("build/app/outputs/flutter-apk").glob("*.apk")):
              print(f"{apk.name}: {apk.stat().st_size / (1024 * 1024):.2f} MiB")
          PY
      - name: Upload ARM64 APK (recommended for most modern phones)
        uses: actions/upload-artifact@v4
        with:
          name: novacut-arm64-v8a-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: novacut-armeabi-v7a-apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: warn
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: novacut-x86_64-apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: warn
